on_http_request:
  - expressions:
      - "req.method != 'POST' || req.url.raw_path != '/webhooks/linq'"
    actions:
      - type: custom-response
        config:
          status_code: 404
          body: "Not found"
  - actions:
      - type: add-headers
        config:
          headers:
            host: "127.0.0.1:3000"